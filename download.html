<title>DADA FANTER — Official Download</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;}
body{
  min-height:100vh; display:flex; align-items:center; justify-content:center;
  padding:clamp(22px,5vh,48px) 6.1%;
  color:#eef6ff; font-family:Arial,Helvetica,sans-serif;
  background:radial-gradient(ellipse at 50% 38%,#082b49 0%,#061a30 46%,#020918 100%);
}
.panel{
  width:100%; max-width:610px; min-height:1008px; padding:54px 44px 48px;
  display:flex; flex-direction:column; align-items:center; text-align:center;
  border:1px solid #087c9c; border-radius:48px;
  background:linear-gradient(155deg,rgba(7,34,58,.96),rgba(3,17,35,.98) 70%,rgba(2,13,29,.98));
  box-shadow:0 0 34px rgba(0,196,255,.13),inset 0 0 28px rgba(0,175,235,.035);
}
.logo{width:min(100%,310px); aspect-ratio:1; object-fit:cover; display:block; margin:0 auto 24px; mix-blend-mode:normal;}
h1{font-size:clamp(30px,7.4vw,52px);font-weight:500;letter-spacing:1px;margin:0 0 10px;white-space:nowrap;}
.sub{margin:0 0 44px;color:#00d9ff;font-size:clamp(14px,3.2vw,22px);font-weight:700;letter-spacing:5px;}
.version{display:inline-block;margin:0 0 38px;padding:15px 30px;border:1px solid #087e9f;border-radius:40px;color:#b9efff;font-size:20px;font-weight:700;background:rgba(0,119,160,.10);}
.desc{margin:0 0 46px;color:#9eb5ce;font-size:clamp(16px,3.6vw,24px);line-height:1.65;}
.download{width:100%;min-height:100px;display:flex;align-items:center;justify-content:center;gap:24px;padding:20px 18px;border-radius:24px;text-decoration:none;color:#001426;font-size:clamp(20px,4.3vw,31px);font-weight:500;background:linear-gradient(100deg,#05d4e8,#078bff);box-shadow:0 0 30px rgba(0,181,255,.24);}
.download:active{transform:scale(.985)}
.download svg{width:30px;height:30px;flex:none;fill:#001426}
.meta{margin:30px 0 0;color:#718ba8;font-size:18px;}
.footer{margin-top:auto;padding-top:48px;color:#718ba8;font-size:18px;letter-spacing:2px;}
@media(max-width:480px){
 body{padding:28px 6.1%}
 .panel{min-height:0;padding:36px 22px 34px;border-radius:34px}
 .logo{width:min(100%,250px);margin-bottom:18px}
 .sub{letter-spacing:3.5px;margin-bottom:32px}
 .version{font-size:16px;padding:12px 22px;margin-bottom:28px}
 .desc{font-size:17px;margin-bottom:34px}
 .download{min-height:78px;border-radius:20px;gap:15px}
 .meta{font-size:14px;margin-top:24px}
 .footer{font-size:15px;padding-top:42px}
}
</style>
